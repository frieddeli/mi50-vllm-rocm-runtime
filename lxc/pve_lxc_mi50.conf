# Proxmox VE unprivileged LXC configuration for AMD MI50 KFD Passthrough
# Append to /etc/pve/lxc/<CTID>.conf

# Allow access to DRM and KFD character devices (Major 226 and 237/239)
lxc.cgroup2.devices.allow: c 226:* rwm
lxc.cgroup2.devices.allow: c 237:* rwm
lxc.cgroup2.devices.allow: c 239:* rwm

# Bind mount the host device nodes
lxc.mount.entry: /dev/kfd dev/kfd none bind,optional,create=file
lxc.mount.entry: /dev/dri/card0 dev/dri/card0 none bind,optional,create=file
lxc.mount.entry: /dev/dri/renderD128 dev/dri/renderD128 none bind,optional,create=file

# Retain capability for memory locking
lxc.prlimit.memlock: unlimited
